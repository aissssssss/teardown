<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Tunnel Dive VJ</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// TUNNEL DIVE: the camera flies down a 3D tube. Four serpents run along its walls (top, bottom, left, right), slithering
// and rolling on their own axes as they race ahead with the camera. The walls carry tiles that zigzag, bob, sway, spin
// and throb, and rings of blinking eyes. In the second breakdown the tunnel folds into a kaleidoscope and then into a
// fractal, and the second drop snaps it back. Synced to the track: 136 BPM, drops at 9.2 s and 37.4 s.
const BPM = 136, T0 = 0.046, DROP1 = 9.2, GAP1 = 7.8, MORPH0 = 28.0, MORPH1 = 33.0, GAP2 = 36.7, DROP2 = 37.4, DURATION = 57.8;
window.DURATION = DURATION;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T, B, Z, FX, DROP, GAP, PAL, ROLL; out vec4 o;
#define PI 3.14159265
#define TAU 6.2831853
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
// hue rotation: every element drifts through the colour wheel on its own
vec3 hs(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a); return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float line(float d, float w){ return smoothstep(w, w * 0.3, abs(d)); }
float spd(float h){ return h < 0.25 ? 0.25 : h < 0.5 ? 0.5 : h < 0.8 ? 1.0 : 2.0; }
// three palettes: violet, fire, acid. k: 0 deep, 1 main, 2 hot, 3 accent
vec3 palK(int p, int k){
  vec3 a[4] = vec3[4](vec3(0.07,0.02,0.32), vec3(0.3,0.22,1.0), vec3(1.0,0.08,0.62), vec3(0.05,0.95,1.0));
  vec3 b[4] = vec3[4](vec3(0.3,0.01,0.0), vec3(1.0,0.25,0.0), vec3(1.0,0.82,0.0), vec3(0.1,1.0,0.25));
  vec3 c[4] = vec3[4](vec3(0.0,0.2,0.1), vec3(0.6,1.0,0.0), vec3(1.0,0.1,0.8), vec3(0.2,0.6,1.0));
  return p == 0 ? a[k] : p == 1 ? b[k] : c[k];
}
vec3 P(int k){ int i = int(PAL); return mix(palK(i, k), palK(min(i + 1, 2), k), fract(PAL)); }

// ------------------------------------------------------------ a wall tile with its own motion
vec3 tile(vec2 f, vec2 id, float kick){
  float h = hash(id), h2 = hash(id + 17.0), hm = hash(id + 31.0);
  float ph = B * 0.25 * spd(hash(id + 47.0)) + h;
  int m = int(hm * 5.0);
  if (m == 0) f.x += 0.12 * sin(ph * TAU) * (1.25 - 0.25 * pow(sin(ph * TAU), 2.0));   // zigzag
  else if (m == 1) f.y += 0.12 * sin(ph * TAU);                                        // up and down
  else if (m == 2) f.x += 0.12 * sin(ph * TAU);                                        // left and right
  else if (m == 3) f = rot(ph * TAU * (h2 < 0.5 ? 1.0 : -1.0)) * f;                    // spin
  else f /= 0.78 + 0.22 * sin(ph * TAU);                                               // throb
  int t = int(h * 4.0);
  float v;
  if (t == 0) v = line(max(abs(f.x), abs(f.y)) - 0.28, 0.05) + (1.0 - smoothstep(0.06, 0.1, max(abs(f.x), abs(f.y)))) * kick;
  else if (t == 1) v = line(fract(f.y * 3.0 - abs(f.x) * 2.0 - B * 0.5) - 0.5, 0.14) * step(abs(f.x), 0.34) * step(abs(f.y), 0.38);
  else if (t == 2) v = line(fract(length(f) * 4.0 - B * 0.5) - 0.5, 0.12) * step(length(f), 0.42);
  else v = line(abs(f.x) + abs(f.y) - 0.32, 0.05) + (1.0 - smoothstep(0.07, 0.11, abs(f.x) + abs(f.y))) * (0.5 + kick);
  float pulse = 0.4 + 0.6 * pow(0.5 + 0.5 * cos(B * PI * 0.5 + h2 * TAU), 2.0);
  return hs(mix(P(1), P(2), step(0.55, h2)) * v * pulse + P(3) * v * step(0.85, h2) * 0.5, B * TAU / 32.0 * spd(h) + h * TAU);
}
// ------------------------------------------------------------ an eye: blinks, gazes, the pupil dilates on the kick
vec3 eye(vec2 f, vec2 id, float kick){
  float h = hash(id + 3.3);
  f.y += 0.05 * sin(B * PI * 0.5 * spd(h) + h * TAU);
  float bt = fract(B / 8.0 + h);
  float open = max(0.05, 1.0 - smoothstep(0.0, 0.03, bt) * (1.0 - smoothstep(0.03, 0.07, bt)));
  float x = f.x / 0.44, lid = 0.26 * (1.0 - x * x) * open;
  float inside = step(abs(x), 1.0) * (1.0 - smoothstep(lid - 0.015, lid, abs(f.y)));
  vec2 q = f - vec2(sin(B * PI / 12.0 + h * TAU) * 0.1, 0.0);
  float r = length(q);
  vec3 c = P(0) * 0.4;
  c = mix(c, mix(P(3), P(2), 0.5 + 0.5 * sin(r * 40.0 - B * PI)), 1.0 - smoothstep(0.15, 0.16, r));
  c = mix(c, vec3(0.0), 1.0 - smoothstep(0.05 + 0.03 * kick, 0.06 + 0.03 * kick, r));
  c += 1.0 - smoothstep(0.012, 0.022, length(q - vec2(-0.04, 0.04)));
  return hs(c * inside + P(3) * step(abs(x), 1.0) * line(abs(f.y) - lid, 0.02), B * TAU / 48.0 + h * TAU);
}
// ------------------------------------------------------------ the tunnel, seen from the camera along ray uv
vec3 tunnel(vec2 uv, float kick){
  vec3 rd = normalize(vec3(uv * (1.15 - 0.08 * kick + 0.1 * sin(T * 0.17)), 1.0));
  rd.xz = rot(0.2 * sin(T * 0.27) + 0.08 * sin(T * 0.61)) * rd.xz;
  rd.yz = rot(0.16 * sin(T * 0.19 + 1.0) + 0.06 * sin(T * 0.53)) * rd.yz;
  rd.xy = rot(ROLL) * rd.xy;
  float t = 1.0 / max(length(rd.xy), 1e-3);                  // hit distance on a tube of radius 1
  float z = Z + t * rd.z;                                     // depth along the tunnel
  float ang = atan(rd.y, rd.x);
  const float N = 16.0;
  vec2 g = vec2(ang / TAU * N, z * N / TAU);
  vec2 id = floor(g), f = fract(g) - 0.5;
  float row = mod(id.y, 64.0);
  vec2 idw = vec2(mod(id.x, N), row);
  vec3 col = mod(row, 4.0) < 0.5 ? eye(f, idw, kick) : tile(f, idw, kick);
  col += P(0) * line(max(abs(f.x), abs(f.y)) - 0.5, 0.04) * 0.25;
  // light streaks racing down a few lanes
  float lane = fract(ang / TAU * 48.0);
  float hl = hash(vec2(floor(ang / TAU * 48.0), 3.0));
  col += mix(vec3(1.0), P(3), hl) * step(0.8, hl) * line(lane - 0.5, 0.08) * smoothstep(0.7, 1.0, fract(z * 0.25 - B * 0.5 * spd(hl))) * 1.2;
  // four serpents on the walls: top, bottom, left, right. Each slithers round its line, rolls on its axis and races
  // ahead in segments that taper at both ends
  for (int s = 0; s < 4; s++) {
    float fs = float(s);
    float base = fs * PI * 0.5 + PI * 0.5 + (mod(fs, 2.0) < 0.5 ? 1.0 : -1.0) * B * TAU / 32.0;
    float sl = 0.32 * sin(z * 0.55 - B * PI * 0.25 * (1.0 + 0.5 * mod(fs, 2.0)) + fs * 1.7);
    float da = mod(ang - (base + sl) + PI, TAU) - PI;
    float seg = (z - T * (6.5 + 0.6 * fs) + fs * 5.0) / 16.0;
    float sp = fract(seg);
    float taper = sp < 0.82 ? pow(sin(PI * sp / 0.82), 0.6) : 0.0;
    float w = 0.17 * taper + 1e-4;
    float v = da / w;
    if (abs(v) < 1.0) {
      float nz = sqrt(1.0 - v * v);
      vec3 n = normalize(vec3(v, 0.0, nz));
      // hexagon scales in (along, around) coordinates; the around coordinate turns: the body rolls
      vec2 hp = vec2(z * 5.0, asin(v) / (PI * 0.5) * 2.4 + B * 0.25 * (s == 1 || s == 3 ? -1.0 : 1.0) * (1.0 + fs * 0.3));
      vec2 rr = vec2(1.0, 1.7320508), ha = mod(hp, rr) - rr * 0.5, hb = mod(hp - rr * 0.5, rr) - rr * 0.5;
      vec2 gv = dot(ha, ha) < dot(hb, hb) ? ha : hb;
      vec2 hid = floor((hp - gv) * 4.0 + 0.5);
      float hd = max(dot(abs(gv), vec2(0.5, 0.8660254)), abs(gv.x));
      float hh = hash(hid + fs * 13.0);
      float own = 0.5 + 0.5 * sin(B * PI * spd(hh) + hh * TAU);
      float wave = pow(0.5 + 0.5 * sin(z * 1.2 - B * PI), 3.0);
      float cellIn = 1.0 - smoothstep(0.36, 0.42, hd);
      vec3 nb = normalize(n + vec3(gv.y, gv.x, 0.0) * 1.1 * cellIn);
      vec3 L = normalize(vec3(-0.4, 0.55, 0.75));
      float dif = 0.1 + 0.9 * max(0.0, dot(nb, L));
      float spec = pow(max(0.0, dot(reflect(-L, nb), vec3(0.0, 0.0, 1.0))), 36.0);
      vec3 hc = hs(hh < 0.4 ? P(3) : hh < 0.75 ? P(1) : P(2), B * TAU / 24.0 + fs * 1.6 + z * 0.15);
      vec3 sc = (hc * 0.4 * cellIn * dif + hc * line(hd - 0.36, 0.035) * 0.9 + mix(hc, vec3(1.0), 0.45) * (1.0 - smoothstep(0.0, 0.24, hd)) * 0.85)
              * (0.35 + 0.65 * max(own * own, wave)) * (0.3 + 0.7 * nz) + vec3(1.0) * spec * 0.5 * cellIn + P(3) * pow(1.0 - nz, 3.0) * 0.4;
      col = mix(col, sc, 1.0 - smoothstep(0.85, 1.0, abs(v)));
    }
  }
  float fog = exp(-t * 0.09);
  col *= fog;
  col += mix(P(2), vec3(1.0), 0.5) * exp(-length(uv) * 9.0) * (0.25 + 0.35 * kick);   // light at the end of the tunnel
  return col;
}
// ------------------------------------------------------------ the fractal: 6-fold mirror and 11 folds
vec3 fractal(vec2 p, float kick){
  p *= 1.9 - 0.01 * T;
  p = rot(T * 0.06) * p;
  float a = atan(p.y, p.x), r = length(p);
  a = abs(mod(a, TAU / 6.0) - TAU / 12.0);
  p = r * vec2(cos(a), sin(a));
  vec3 col = vec3(0.0); float s = 1.0;
  for (int i = 0; i < 11; i++) {
    p = abs(p) - vec2(0.42 + 0.1 * sin(B * TAU / 32.0), 0.28 + 0.08 * cos(B * TAU / 48.0));
    p = rot(0.62 + 0.2 * sin(T * 0.13)) * p;
    p *= 1.34; s *= 1.34;
    float g1 = 0.0045 / (abs(length(p) - 0.55 - 0.08 * kick) / s + 0.0045), g2 = 0.002 / (abs(p.y) / s + 0.002);
    vec3 c = 0.5 + 0.5 * cos(TAU * (float(i) * 0.075 + B / 64.0 + vec3(0.0, 0.33, 0.67)));
    col += c * c * 1.4 * (g1 * g1 * 1.3 + g1 * 0.1 + g2 * g2 * 0.45) / (1.0 + float(i) * 0.35) * (0.7 + 0.8 * kick * step(float(i), 4.0));
  }
  return col;
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * R) / R.y;
  float kick = exp(-fract(B) * 6.0) * (1.0 - GAP);
  // the fold: the tunnel's view mirrors into a kaleidoscope first, then dissolves into the fractal
  float k1 = smoothstep(0.0, 0.55, FX), k2 = smoothstep(0.45, 1.0, FX);
  vec2 q = uv;
  if (k1 > 0.0) {
    float a = atan(uv.y, uv.x), r = length(uv);
    float am = abs(mod(a + T * 0.2, TAU / 6.0) - TAU / 12.0);
    q = mix(uv, r * vec2(cos(am), sin(am)), k1);
    q = rot(k1 * PI * 0.5) * q;
  }
  vec3 col = vec3(0.0);
  if (k2 < 1.0) col = tunnel(q, kick) * (1.0 - k2);
  if (k2 > 0.0) col += fractal(uv, kick) * k2;
  col *= (0.92 + 0.3 * kick) * (1.0 - 0.75 * GAP);
  col = 1.0 - exp(-col * 1.5);
  float l = dot(col, vec3(0.299, 0.587, 0.114));
  col = clamp(mix(vec3(l), col, 1.3), 0.0, 1.0);
  col = mix(col, vec3(l) * vec3(1.05, 1.07, 1.12) * 1.7, DROP);          // silver flash on each drop
  col *= 1.0 - 0.45 * smoothstep(0.4, 0.9, length(uv * vec2(1.25, 1.0)));
  col += (hash(gl_FragCoord.xy + fract(T * 30.0) * 97.0) - 0.5) * 0.025;
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
const gl = document.getElementById('c').getContext('webgl2', {preserveDrawingBuffer: true});
const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 v;void main(){gl_Position=vec4(v,0,1);}'));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(pr, n);
const ss = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
// camera speed: cruising, held back in the gaps, surging after each drop; Z is its integral (smooth, never jumps)
const speed = (t) => 4.0 + 2.5 * ss(DROP1, DROP1 + 2, t) - 3.2 * (ss(GAP1, GAP1 + 0.4, t) - ss(DROP1 - 0.1, DROP1, t)) - 3.0 * (ss(GAP2, GAP2 + 0.3, t) - ss(DROP2 - 0.1, DROP2, t)) + 1.5 * ss(DROP2, DROP2 + 2, t);
const zAt = (t) => { let z = 0; const n = Math.ceil(t * 120); for (let i = 0; i < n; i++) z += speed((i + 0.5) / 120) / 120; return z; };
const draw = (t) => {
  const gap = ss(GAP1, GAP1 + 0.4, t) * (1 - ss(DROP1 - 0.05, DROP1, t)) + ss(GAP2, GAP2 + 0.35, t) * (1 - ss(DROP2 - 0.05, DROP2, t));
  const fx = ss(MORPH0, MORPH1, t) * (1 - ss(DROP2 - 0.02, DROP2, t));
  const drop = (t >= DROP1 ? Math.exp(-(t - DROP1) * 2.6) : 0) + (t >= DROP2 ? Math.exp(-(t - DROP2) * 2.6) : 0);
  const pal = ss(DROP1 - 0.2, DROP1 + 1.3, t) + ss(DROP2 - 0.2, DROP2 + 1.3, t);
  const roll = 0.35 * Math.sin(t * 0.21) + 0.5 * ss(DROP1, DROP1 + 3, t) * Math.sin(t * 0.37) + Math.PI * 0.5 * ss(DROP2, DROP2 + 4, t);
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform2f(U('R'), 1080, 1920);
  gl.uniform1f(U('T'), t);
  gl.uniform1f(U('B'), ((t - T0) * BPM) / 60);
  gl.uniform1f(U('Z'), zAt(t));
  gl.uniform1f(U('FX'), fx);
  gl.uniform1f(U('DROP'), Math.min(1, drop));
  gl.uniform1f(U('GAP'), gap);
  gl.uniform1f(U('PAL'), Math.min(2, pal));
  gl.uniform1f(U('ROLL'), roll);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
};
window.seek = draw;
if (location.search.includes('render')) draw(0);
else { const t0 = performance.now(); const f = (n) => { draw(((n - t0) / 1000) % DURATION); requestAnimationFrame(f); }; requestAnimationFrame(f); }
window.READY = true;
</script></body></html>
