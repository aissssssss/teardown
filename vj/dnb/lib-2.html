<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>VJ Math Library</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// VJ MATH LIBRARY: four light 2D scenes made only of formulas, 9:16, synced to a BPM.
//   ?scene=0  DROSTE   an endless spiral tunnel of neon tiles; alternate rings turn opposite ways
//   ?scene=1  LIQUID   domain-warped noise: oil on water, melting marble with contour bands
//   ?scene=2  JULIA    a Julia set whose constant orbits slowly: spirals of fire that never stop changing
//   ?scene=3  OPART    hypnotic warped rings and spiral arms, counter-rotating, breathing on the beat
//   ?scene=set (default) all four in turn, 8 bars each, crossfading over one bar
//   &bpm=136  &dur=60  (seconds)
// Every scene gets chromatic aberration that opens on the kick and a silver flash every 16 bars.
const Q = new URLSearchParams(location.search);
const BPM = 172.2, DURATION = 106, SCENE = '2';
window.DURATION = DURATION;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T, B, SA, SB, MIXK; out vec4 o;
#define TAU 6.2831853
#define PI 3.14159265
vec3 pal(float x){ vec3 c = 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67))); return c * c * 1.3; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = rot(0.5) * p * 2.02; a *= 0.5; } return v; }
float kick(){ return exp(-fract(B) * 6.0); }

vec3 droste(vec2 p){
  float r = length(p), a = atan(p.y, p.x);
  vec2 w = vec2(a / TAU, log(r) / 1.1 - T * 0.32);
  w.x += w.y;                                                     // the shear that makes it a spiral
  vec2 g = vec2(w.x * 8.0, w.y * 3.0);
  g.x += (mod(floor(g.y), 2.0) < 0.5 ? 1.0 : -1.0) * B * 0.125;  // neighbouring rings turn opposite ways
  vec2 f = fract(g) - 0.5, id = floor(g);
  float sg = mod(id.x + id.y, 2.0) < 0.5 ? 1.0 : -1.0;
  f = rot(sg * B * PI * 0.25) * f;                                // each tile spins against its neighbours
  float d = abs(max(abs(f.x), abs(f.y)) - 0.3);
  float v = smoothstep(0.07, 0.02, d) + smoothstep(0.14, 0.0, length(f)) * (0.3 + kick());
  return pal(id.y * 0.06 + sg * B / 48.0 + id.x * 0.01) * v * smoothstep(0.0, 0.2, r);
}
vec3 liquid(vec2 p){
  p *= 2.2;
  vec2 q = vec2(fbm(p + 0.1 * T), fbm(p + vec2(5.2, 1.3) - 0.12 * T));
  vec2 s = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + 0.15 * T), fbm(p + 4.0 * q + vec2(8.3, 2.8) - 0.13 * T));
  float f = fbm(p + 4.0 * s + 0.05 * kick());
  vec3 col = pal(f * 1.6 + length(q) * 0.8 + B / 32.0) * (f * f * 2.2);
  col += pal(f * 3.0 + 0.5) * smoothstep(0.06, 0.0, abs(fract(f * 9.0 - B * 0.25) - 0.5) - 0.42) * 0.8;   // contour bands
  return col;
}
vec3 julia(vec2 p){
  vec2 z = rot(T * 0.05) * p * 3.4;
  vec2 c = 0.7885 * vec2(cos(T * 0.11 + 1.9), sin(T * 0.11 + 1.9));
  float it = 0.0, trap = 1e9;
  for (int i = 0; i < 160; i++) {
    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
    trap = min(trap, abs(length(z) - 0.6));
    if (dot(z, z) > 64.0) break;
    it += 1.0;
  }
  float sm = it - log2(log2(max(dot(z, z), 1.0001)));
  vec3 col = pal(sm * 0.04 + B / 32.0) * (0.15 + 0.85 * pow(fract(sm * 0.1 - B * 0.125), 2.0)) * step(it, 159.0) + pal(B / 32.0 + 0.5) * 0.08 * step(159.0, it);
  return col + pal(sm * 0.03 + 0.4) * exp(-trap * 30.0) * (0.5 + kick());
}
vec3 opart(vec2 p){
  float r = length(p), a = atan(p.y, p.x);
  float ring = sin(38.0 * r - B * PI + 5.0 * sin(3.0 * a + T * 0.7) * r);
  float sg = mod(floor(r * 6.0), 2.0) < 0.5 ? 1.0 : -1.0;          // bands of arms counter-rotate
  float arms = sin(8.0 * a + sg * T * 1.2 + 10.0 * r);
  float v = smoothstep(-0.15, 0.15, ring * arms);
  vec3 c = pal(r * 0.8 - B / 16.0 + 0.25 * sg);
  return mix(vec3(0.0), c, v) + c * smoothstep(0.12, 0.0, abs(ring * arms)) * 0.8 * (0.6 + kick());
}
vec3 scene(float s, vec2 p){
  return s < 0.5 ? droste(p) : s < 1.5 ? liquid(p) : s < 2.5 ? julia(p) : opart(p);
}
vec3 frameAt(vec2 p){
  vec3 a = scene(SA, p);
  return MIXK > 0.0 ? mix(a, scene(SB, rot(MIXK * 0.6) * p * (1.0 + 0.3 * MIXK)), MIXK) : a;
}
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * R) / R.y;
  p *= 1.0 - 0.04 * kick();
  // chromatic aberration: red and blue pulled apart from the centre, wider on the kick
  float ca = 0.004 + 0.016 * kick();
  vec3 col = vec3(frameAt(p * (1.0 + ca)).r, frameAt(p).g, frameAt(p * (1.0 - ca)).b);
  float fl = exp(-mod(B, 64.0) * 1.2);                               // a silver flash every 16 bars
  col = 1.0 - exp(-col * 1.4);
  col = mix(col, vec3(dot(col, vec3(0.3, 0.59, 0.11))) * 1.6, fl);
  col *= 1.0 - 0.4 * smoothstep(0.4, 0.9, length(p * vec2(1.2, 1.0)));
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
const gl = document.getElementById('c').getContext('webgl2', {preserveDrawingBuffer: true});
const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 v;void main(){gl_Position=vec4(v,0,1);}'));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(pr, n);
const draw = (t) => {
  const b = ((t - 0.209) * BPM) / 60;
  let sa, sb, mk;
  if (SCENE === 'set') {
    const seg = b / 32;                                                // 8 bars per scene
    sa = Math.floor(seg) % 4; sb = (sa + 1) % 4;
    const f = (seg % 1) * 8;                                           // bars into the segment
    const u = Math.max(0, Math.min(1, f - 7));                         // the last bar crossfades
    mk = u * u * (3 - 2 * u);
  } else { sa = sb = Number(SCENE); mk = 0; }
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform2f(U('R'), 1080, 1920);
  gl.uniform1f(U('T'), t); gl.uniform1f(U('B'), b);
  gl.uniform1f(U('SA'), sa); gl.uniform1f(U('SB'), sb); gl.uniform1f(U('MIXK'), mk);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
};
window.seek = draw;
if (Q.has('render')) draw(0);
else { const t0 = performance.now(); const f = (n) => { draw(((n - t0) / 1000) % DURATION); requestAnimationFrame(f); }; requestAnimationFrame(f); }
window.READY = true;
</script></body></html>
