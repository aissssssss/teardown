<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>DnB Torus VJ</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// DNB SCENES, drum'n'bass tempo (172 BPM).
//   scene 0  TORUS: a ray-marched torus (one distance formula) dressed in the tunnel's tiles and eyes, four hexagon
//            serpents orbiting its tube and swapping places, a bead chain circling outside it, an eye mandala at its
//            heart, light streaks, colour snapping on the beat.
//   scene 1  DOTS: a 4-fold mirrored mandala of dots and rings that grow, shrink and re-pattern on the beat.
const Q = new URLSearchParams(location.search);
const BPM = 172, SCENE = Number(Q.get('scene') || 0), DURATION = Number(Q.get('dur') || 8);
window.DURATION = DURATION;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T, B; uniform int S; out vec4 o;
#define PI 3.14159265
#define TAU 6.2831853
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float line(float d, float w){ return smoothstep(w, w * 0.3, abs(d)); }
vec3 pal(float x){ vec3 c = 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67))); return c * c * 1.3; }
vec3 hs(vec3 c, float a){ const vec3 k = vec3(0.57735); float ca = cos(a); return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca); }
float kick(){ return exp(-fract(B * 0.5) * 5.0); }             // half-time pulse, the DnB feel
float snare(){ return exp(-fract(B * 0.5 + 0.5) * 7.0); }
// the colour snaps to a new key every 4 beats
vec3 key(int k){ float h = floor(B / 4.0) * 0.37; return hs(k == 0 ? vec3(0.45, 1.0, 0.1) : k == 1 ? vec3(0.1, 0.9, 1.0) : vec3(1.0, 0.15, 0.7), h * TAU); }

// ------------------------------------------------------------ TORUS
const float RM = 1.0, RT = 0.38;
float torus(vec3 p){ vec2 q = vec2(length(p.xz) - RM, p.y); return length(q) - RT; }
mat3 tumble(){ float a = T * 0.35, b = 0.6 + 0.35 * sin(T * 0.23);
  mat3 rx = mat3(1, 0, 0, 0, cos(b), -sin(b), 0, sin(b), cos(b));
  mat3 ry = mat3(cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a));
  return rx * ry; }
vec3 skin(vec3 p, vec3 n){
  // surface coordinates: u round the ring, v round the tube
  float u = atan(p.z, p.x), v = atan(p.y, length(p.xz) - RM);
  vec2 g = vec2(u / TAU * 36.0, v / TAU * 12.0);
  g.x += (mod(floor(g.y), 2.0) < 0.5 ? 1.0 : -1.0) * B * 0.25;   // alternate bands slide opposite ways round the ring
  vec2 id = floor(g), f = fract(g) - 0.5;
  float sg = mod(id.x + id.y, 2.0) < 0.5 ? 1.0 : -1.0, h = hash(id);
  f = rot(sg * B * PI * 0.25 * (h < 0.5 ? 1.0 : 0.0)) * f;
  float d = h < 0.33 ? abs(max(abs(f.x), abs(f.y)) - 0.3) : h < 0.66 ? abs(abs(f.x) + abs(f.y) - 0.32) : abs(length(f) - 0.28);
  vec3 col = key(h < 0.5 ? 0 : 2) * line(d, 0.07) * (0.6 + 0.6 * sin(sg * B * PI * 0.5 + h * TAU)) * 1.3;
  // four hexagon serpents orbiting the tube, two each way, so they cross
  for (int s = 0; s < 4; s++) {
    float fs = float(s);
    float base = fs * PI * 0.5 + (mod(fs, 2.0) < 0.5 ? 1.0 : -1.0) * B * TAU / 16.0;
    float da = mod(v - (base + 0.35 * sin(u * 5.0 - B * PI * 0.5 + fs)) + PI, TAU) - PI;
    float seg = fract(u / TAU * 2.0 - T * 0.12 * (1.0 + 0.3 * fs) + fs * 0.25);
    float w = 0.33 * pow(max(sin(PI * min(seg / 0.85, 1.0)), 0.0), 0.6) * step(seg, 0.85) + 1e-4;
    float vv = da / w;
    if (abs(vv) < 1.0) {
      float nz = sqrt(1.0 - vv * vv);
      vec2 hp = vec2(u * 9.0, asin(vv) / (PI * 0.5) * 2.2 + B * 0.25 * (mod(fs, 2.0) < 0.5 ? 1.0 : -1.0));
      vec2 rr = vec2(1.0, 1.7320508), ha = mod(hp, rr) - rr * 0.5, hb = mod(hp - rr * 0.5, rr) - rr * 0.5;
      vec2 gv = dot(ha, ha) < dot(hb, hb) ? ha : hb;
      vec2 hid = floor((hp - gv) * 4.0 + 0.5);
      float hd = max(dot(abs(gv), vec2(0.5, 0.8660254)), abs(gv.x)), hh = hash(hid + fs * 7.0);
      float own = 0.5 + 0.5 * sin((mod(hid.x + hid.y, 2.0) < 0.5 ? 1.0 : -1.0) * B * PI + hh * TAU);
      vec3 hc = hs(key(s == 0 || s == 2 ? 1 : 2), hh * 2.0 + fs);
      vec3 sc = (hc * 0.35 * (1.0 - smoothstep(0.36, 0.42, hd)) + hc * line(hd - 0.36, 0.04) + mix(hc, vec3(1.0), 0.5) * (1.0 - smoothstep(0.0, 0.22, hd)) * own) * (0.35 + 0.65 * nz);
      col = mix(col, sc, 1.0 - smoothstep(0.85, 1.0, abs(vv)));
    }
  }
  return col;
}
vec3 eyeMandala(vec2 p){
  float r = length(p), a = atan(p.y, p.x);
  float ring = floor(r * 10.0), n = 6.0 + ring * 4.0;
  float aa = a + (mod(ring, 2.0) < 0.5 ? 1.0 : -1.0) * B * 0.2;
  vec2 f = vec2((fract(aa / TAU * n) - 0.5) * 1.4, fract(r * 10.0) - 0.5);
  float x = f.x / 0.45, lid = 0.24 * (1.0 - x * x) * (0.3 + 0.7 * smoothstep(0.0, 0.1, abs(fract(B / 8.0 + ring * 0.13) - 0.05)));
  float eye = step(abs(x), 1.0) * line(abs(f.y) - lid, 0.03);
  float iris = 1.0 - smoothstep(0.1, 0.12, length(f));
  float pup = 1.0 - smoothstep(0.03 + 0.03 * kick(), 0.05 + 0.03 * kick(), length(f));
  return (key(0) * eye + key(1) * iris * (1.0 - pup) * 0.8) * smoothstep(0.75, 0.2, r) * step(0.08, r);
}
vec3 torusScene(vec2 uv){
  vec3 col = eyeMandala(uv * (1.3 - 0.1 * kick()));
  // light streaks across the frame
  float lane = floor(uv.y * 40.0), hl = hash(vec2(lane, 1.0));
  col += vec3(1.0) * step(0.86, hl) * line(fract(uv.y * 40.0) - 0.5, 0.12) * smoothstep(0.85, 1.0, fract(uv.x * 0.6 - T * (1.5 + 2.0 * hl) + hl)) * 0.9;
  vec3 ro = vec3(0.0, 0.0, -5.0 + 0.3 * kick()), rd = normalize(vec3(uv, 1.25));
  mat3 M = tumble();
  float t = 0.0, d;
  for (int i = 0; i < 90; i++) { d = torus(M * (ro + rd * t)); if (d < 0.001 || t > 8.0) break; t += d; }
  // the bead chain: a thin ring of dashes circling outside the torus, tilted the other way
  vec3 bc = vec3(0.0);
  {
    float b = 0.9 + 0.3 * sin(T * 0.3);
    mat3 N = mat3(1, 0, 0, 0, cos(-b), -sin(-b), 0, sin(-b), cos(-b));
    float tb = 0.0, db = 1e9;
    for (int i = 0; i < 60; i++) { vec3 q = N * (ro + rd * tb); db = length(vec2(length(q.xz) - 1.55, q.y)) - 0.06; if (db < 0.002 || tb > 8.0) break; tb += db; }
    if (db < 0.002 && (tb < t || d > 0.01)) {
      vec3 q = N * (ro + rd * tb);
      float u = atan(q.z, q.x);
      float dash = step(0.35, fract(u / TAU * 64.0 - B * 0.5));
      bc = mix(key(0), vec3(1.0), 0.2) * dash * (0.8 + 0.6 * kick());
      if (dash > 0.5) { col = bc; t = 99.0; }
    }
  }
  if (d < 0.001 && t < 8.0) {
    vec3 p = M * (ro + rd * t);
    vec2 q = vec2(length(p.xz) - RM, p.y);
    vec3 cdir = vec3(normalize(p.xz).x, 0.0, normalize(p.xz).y);
    vec3 n = normalize(p - cdir * RM);
    float dif = 0.45 + 0.75 * max(0.0, dot(n, normalize(vec3(-0.4, 0.6, -0.7))));
    float rim = pow(1.0 - abs(dot(n, normalize(M * rd))), 3.0);
    col = skin(p, n) * dif + key(1) * rim * 0.6;
  }
  return col;
}
// ------------------------------------------------------------ DOTS
vec3 dots(vec2 p){
  p *= 1.0 - 0.05 * kick();
  p = abs(p); if (p.y > p.x) p = p.yx;                           // 8-way mirror
  float r = length(p);
  p += 0.04 * vec2(sin(p.y * 9.0 + T), cos(p.x * 9.0 - T));      // a slow warp so the field breathes
  vec2 g = p * (20.0 + 3.0 * sin(B * PI / 16.0));
  vec2 rr = vec2(1.0, 1.7320508), ha = mod(g, rr) - rr * 0.5, hb = mod(g - rr * 0.5, rr) - rr * 0.5;
  vec2 f = dot(ha, ha) < dot(hb, hb) ? ha : hb;
  vec2 id = g - f;
  float wave = sin(length(id) * 0.9 - B * PI * 0.5) * 0.5 + 0.5;
  float rad = 0.18 + 0.26 * wave * (0.7 + 0.3 * snare());
  float d = length(f);
  float dot = 1.0 - smoothstep(rad - 0.03, rad, d);
  float ring = line(d - rad - 0.08, 0.03) * step(0.5, hash(floor(id)));
  vec3 c = pal(length(id) * 0.035 - B / 16.0 + hash(floor(id)) * 0.15);
  vec3 c2 = pal(length(id) * 0.035 - B / 16.0 + 0.5);
  return c * dot * (0.6 + 0.4 * wave) + c2 * ring + c * (1.0 - smoothstep(0.0, 0.06, d)) * 0.6;
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * R) / R.y;
  vec3 col = S == 0 ? torusScene(uv) : dots(uv);
  col *= 0.9 + 0.35 * kick();
  col = 1.0 - exp(-col * 1.5);
  col *= 1.0 - 0.45 * smoothstep(0.4, 0.9, length(uv * vec2(1.25, 1.0)));
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
const gl = document.getElementById('c').getContext('webgl2', {preserveDrawingBuffer: true});
const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 v;void main(){gl_Position=vec4(v,0,1);}'));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const draw = (t) => {
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), 1080, 1920);
  gl.uniform1f(gl.getUniformLocation(pr, 'T'), t);
  gl.uniform1f(gl.getUniformLocation(pr, 'B'), (t * BPM) / 60);
  gl.uniform1i(gl.getUniformLocation(pr, 'S'), SCENE);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
};
window.seek = draw;
if (Q.has('render')) draw(0);
else { const t0 = performance.now(); const f = (n) => { draw(((n - t0) / 1000) % DURATION); requestAnimationFrame(f); }; requestAnimationFrame(f); }
window.READY = true;
</script></body></html>
