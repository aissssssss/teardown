<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Mandelbrot Dive VJ</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// MANDELBROT DIVE: a zoom from the whole set into a mini-universe, the period-3 mini-Mandelbrot on the real axis at
// c = -1.7548776662. Smooth iteration colouring in neon on black, an orbit-trap glow for the filaments, the palette
// running on the beat. One formula: z = z^2 + c.
const BPM = 143.5, T0 = 0.116, DURATION = 30.2;
window.DURATION = DURATION;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T, B; out vec4 o;
#define TAU 6.2831853
vec3 pal(float x){ vec3 c = 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67))); return c * c * 1.3; }
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * R) / R.y;
  float k = clamp(T / ${DURATION}, 0.0, 1.0);
  float e = k * k * (3.0 - 2.0 * k);
  float w = exp(mix(log(3.2), log(0.045), e));                   // view height: the whole set down to the mini-brot
  vec2 ctr = mix(vec2(-0.6, 0.0), vec2(-1.7548776662, 0.0015), smoothstep(0.0, 0.35, e));
  float a = T * 0.06;
  p = mat2(cos(a), -sin(a), sin(a), cos(a)) * p;
  vec2 c = ctr + p * w, z = vec2(0.0);
  float trap = 1e9, it = 0.0;
  for (int i = 0; i < 400; i++) {
    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
    trap = min(trap, abs(z.x * z.y));                              // a cross trap: bright filaments
    if (dot(z, z) > 256.0) break;
    it += 1.0;
  }
  float kick = exp(-fract(B) * 5.0);
  vec3 col;
  if (it >= 399.0) col = pal(B / 32.0 + 0.6) * 0.06 + vec3(0.0);      // inside: near black, a faint tint
  else {
    float sm = it - log2(log2(dot(z, z))) + 4.0;                   // smooth iteration count
    col = pal(sm * 0.035 + B / 32.0) * (0.08 + 0.92 * pow(fract(sm * 0.09 - B / 16.0), 2.2));
    col += pal(sm * 0.05 + 0.3) * exp(-trap * 60.0) * (0.6 + 0.6 * kick);
    col *= smoothstep(0.0, 6.0, sm);
  }
  col = 1.0 - exp(-col * 1.4);
  col *= 1.0 - 0.4 * smoothstep(0.35, 0.9, length((gl_FragCoord.xy - 0.5 * R) / R.y * vec2(1.2, 1.0)));
  o = vec4(col, 1.0);
}`;
const gl = document.getElementById('c').getContext('webgl2', {preserveDrawingBuffer: true});
const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 v;void main(){gl_Position=vec4(v,0,1);}'));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const draw = (t) => {
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), 1080, 1920);
  gl.uniform1f(gl.getUniformLocation(pr, 'T'), t);
  gl.uniform1f(gl.getUniformLocation(pr, 'B'), ((t - T0) * BPM) / 60);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
};
window.seek = draw;
if (location.search.includes('render')) draw(0);
else { const t0 = performance.now(); const f = (n) => { draw(((n - t0) / 1000) % DURATION); requestAnimationFrame(f); }; requestAnimationFrame(f); }
window.READY = true;
</script></body></html>
