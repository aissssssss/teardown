<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lathe Mandelbrot VJ</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;height:100vh;width:auto;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// APOLLONIAN UNIVERSE: a closed world of spheres inside spheres. Space is folded into a repeating cell and inverted
// in a sphere 8 times (p = -1 + 2*fract(p/2 + 1/2); p *= s / |p|^2); the distance to the result is ray-marched. The
// orbit of each point colours it: pink pearls, gold arches, violet lattice. The camera drifts through the chambers,
// the inversion strength breathes over the phrase and pulses on the kick, so the whole universe morphs to the beat.
const BPM = 136, T0 = 0.046, DURATION = 57.8;
window.DURATION = DURATION;
const FRAG = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T, B; out vec4 o;
#define TAU 6.2831853
// LATHE MANDELBROT: the Mandelbrot set turned on a lathe. Its real axis stands vertical, so the main cardioid, the
// big bulb and the chain of smaller bulbs become stacked spinning tops, and the filaments become the frilled rims.
// A forest of towers repeats on a grid; the camera glides between them. The seed z0 drifts, so every top keeps
// reshaping. Rainbow bands by height and a rainbow sunburst behind.
vec3 pal(float x){ return 0.5 + 0.5 * cos(TAU * (x + vec3(0.0, 0.33, 0.67))); }
float trap;
float de(vec3 p){
  vec2 cell = floor(p.xz / 6.0 + 0.5);
  p.xz -= cell * 6.0;
  float k = 0.62;                                     // world units to set units
  vec2 c = vec2(0.35 - p.y * k, length(p.xz) * k);    // real axis vertical, distance from the axis imaginary
  vec2 z = vec2(0.03 * sin(T * 0.21 + cell.x), 0.03 * cos(T * 0.17 + cell.y)), dz = vec2(0.0);
  trap = 1e9;
  for (int i = 0; i < 40; i++) {
    dz = 2.0 * vec2(z.x * dz.x - z.y * dz.y, z.x * dz.y + z.y * dz.x) + vec2(1.0, 0.0);
    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
    trap = min(trap, abs(length(z) - 0.5));
    if (dot(z, z) > 64.0) break;
  }
  float r = length(z);
  return 0.5 * r * log(r) / max(length(dz), 1e-6) / k * 0.6;
}
void main(){
  vec2 uv = (2.0 * gl_FragCoord.xy - R) / R.y;
  float tm = T * 0.6;
  vec3 ro = vec3(tm, 0.2 + 0.6 * sin(T * 0.23), 3.0 + 0.8 * sin(T * 0.17));
  vec3 ta = ro + vec3(1.0, -0.1 + 0.25 * sin(T * 0.31), -0.55 + 0.3 * sin(T * 0.13));
  vec3 cw = normalize(ta - ro), cu = normalize(cross(cw, vec3(0.0, 1.0, 0.0))), cv = cross(cu, cw);
  vec3 rd = normalize(uv.x * cu + uv.y * cv + 1.5 * cw);
  // rainbow sunburst behind everything
  float a = atan(rd.y - 0.1, rd.x * cw.z - rd.z * cw.x);
  vec3 col = pal(length(uv) * 0.6 - T * 0.15) * (0.55 + 0.45 * sin(a * 24.0 + T * 0.8)) * 0.9 + 0.15;
  float t = 0.05, h = 1.0;
  for (int i = 0; i < 160; i++) { h = de(ro + rd * t); if (h < 0.0008 * t || t > 30.0) break; t += h; }
  if (t < 30.0) {
    vec3 p = ro + rd * t;
    float tr = trap;
    vec2 e = vec2(0.002 * t, 0.0);
    vec3 n = normalize(vec3(de(p + e.xyy) - de(p - e.xyy), de(p + e.yxy) - de(p - e.yxy), de(p + e.yyx) - de(p - e.yyx)));
    vec3 band = pal(p.y * 1.6 + atan(p.z, p.x) * 0.0 + T * 0.05);                // rainbow rings round each top
    vec3 alb = mix(band, pal(tr * 3.0 + 0.6) * 1.1, smoothstep(0.08, 0.0, tr) * 0.8);
    vec3 L = normalize(vec3(-0.5, 0.8, 0.4));
    float dif = clamp(dot(n, L), 0.0, 1.0), spe = pow(clamp(dot(reflect(rd, n), L), 0.0, 1.0), 30.0);
    float fre = pow(1.0 - clamp(-dot(rd, n), 0.0, 1.0), 3.0);
    vec3 lit = alb * (0.35 + 0.9 * dif) + spe * 0.8 + pal(T * 0.1 + fre) * fre * 0.5;
    col = mix(lit, col, 1.0 - exp(-0.05 * t * t / 9.0));
  }
  col = pow(clamp(col, 0.0, 1.0), vec3(0.9));
  col *= 1.0 - 0.3 * smoothstep(0.6, 1.6, length(uv * vec2(1.2, 1.0)));
  o = vec4(col, 1.0);
}`;
const gl = document.getElementById('c').getContext('webgl2', {preserveDrawingBuffer: true});
const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 v;void main(){gl_Position=vec4(v,0,1);}'));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const draw = (t) => {
  gl.viewport(0, 0, 1080, 1920);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), 1080, 1920);
  gl.uniform1f(gl.getUniformLocation(pr, 'T'), t);
  gl.uniform1f(gl.getUniformLocation(pr, 'B'), ((t - T0) * BPM) / 60);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish();
};
window.seek = draw;
if (location.search.includes('render')) draw(0);
else { const t0 = performance.now(); const f = (n) => { draw(((n - t0) / 1000) % DURATION); requestAnimationFrame(f); }; requestAnimationFrame(f); }
window.READY = true;
</script></body></html>
